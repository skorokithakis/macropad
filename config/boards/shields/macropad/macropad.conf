# This file was generated from a template. Edit it to match your keyboard.
# See https://zmk.dev/docs/development/hardware-integration/new-shield for more
# instructions.

# This file will be copied into the user's config directory when they add this
# keyboard. Define any Kconfig options users may frequently want to set here,
# but leave them commented out, for example:

# Uncomment to enable the encoder
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Enable battery sensing for Nice!Nano
CONFIG_ZMK_BATTERY_REPORTING=y

# Enable idle deep sleep (wakes via kscan wakeup-source)
CONFIG_ZMK_SLEEP=y

# Use 11 Bluetooth profiles.
CONFIG_BT_MAX_CONN=11
CONFIG_BT_MAX_PAIRED=11
CONFIG_ZMK_KEYBOARD_NAME="Stavropad"
# Allow longer macro phrases without truncation.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=10

# Disable 2M PHY for better compatibility with older Bluetooth adapters.
CONFIG_BT_CTLR_PHY_2M=n

# Disable NFC to use P0.09 and P0.10 as GPIO.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable mouse emulation
CONFIG_ZMK_POINTING=y

# Increase Bluetooth transmit power for better signal strength.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
